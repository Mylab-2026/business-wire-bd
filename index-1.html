<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Business Wire BD">
<title>Business Wire BD</title>
<style>
:root{--bg:#fff;--ink:#111;--mute:#6b6b6b;--line:#e3e3e3;--acc:#ff6a00;--chip:#f1f1f1;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0b0b0c;--ink:#f2f2f2;--mute:#9a9a9a;--line:#2a2a2d;--chip:#1c1c1f;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;max-width:620px;margin:0 auto;padding:env(safe-area-inset-top,0) 0 76px}
header{background:#000;color:#fff;position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 14px}
.logo{font:800 18px Georgia,serif}.logo b{color:var(--acc)}
.lang button{background:none;border:1px solid #555;color:#bbb;padding:5px 10px;font-size:12px;font-weight:700}
.lang button.on{background:var(--acc);color:#000}
.bar{background:var(--acc);color:#000;font-size:12px;font-weight:700;padding:5px 14px;display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line)}
.chips button{flex:none;border:0;background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:16px;font-size:13px;font-weight:600}
.chips button.on{background:var(--ink);color:var(--bg)}
main{padding:0 14px}
.art{display:block;padding:14px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none}
.tag{color:var(--acc);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.new{background:var(--acc);color:#000;padding:1px 5px;margin-left:6px;border-radius:2px}
.art h3{font:700 18px/1.3 Georgia,"Noto Serif Bengali",serif;margin:3px 0}
.art p{color:var(--mute);font-size:13px;margin-bottom:3px}.meta{color:var(--mute);font-size:12px}
h2{font:800 13px sans-serif;text-transform:uppercase;letter-spacing:.8px;margin:18px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--ink)}
table{width:100%;border-collapse:collapse}td{padding:11px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}td:first-child{text-align:left;font-weight:700}
.note{background:var(--chip);color:var(--mute);font-size:12px;padding:8px 10px;margin:12px 0;border-left:3px solid var(--acc)}
.term{padding:10px 0;border-bottom:1px solid var(--line)}.term span{color:var(--mute);font-size:13px;display:block}
input{width:100%;padding:10px;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:6px;font-size:15px;margin:10px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;display:flex;background:#000;padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;background:none;border:0;color:#999;padding:10px 0;font-size:11px;font-weight:700}nav i{display:block;font-style:normal;font-size:18px}nav .on{color:var(--acc)}
.hide{display:none}
</style></head><body>
<header><div class="top"><div class="logo">BUSINESS<b>WIRE</b> BD</div><div class="lang"><button id="en">EN</button><button id="bn">বাংলা</button></div></div>
<div class="bar"><span id="st"></span><span id="rf" style="cursor:pointer">⟳</span></div></header>
<div class="chips" id="chips"></div><main id="app"></main><nav id="nav"></nav>
<script>
var L="en",TAB="news",CAT="all",D=null;
try{L=localStorage.getItem("lang")||"en"}catch(e){}
var U={news:["News","সংবাদ"],rates:["Rates","দর"],global:["Global","বিশ্ব"],terms:["Terms","শব্দকোষ"],
live:["Updated","হালনাগাদ"],load:["Loading…","লোড হচ্ছে…"],fail:["Could not load. Tap ⟳ to retry.","লোড করা যায়নি। ⟳ চাপুন।"],
cur:["Currency vs BDT","টাকার বিপরীতে মুদ্রা"],dse:["DSE/CSE live prices need a licensed data feed. Coming in the next phase.","DSE/CSE লাইভ দামের জন্য লাইসেন্সড ডেটা ফিড লাগবে। পরের ধাপে যুক্ত হবে।"],
srch:["Search a term…","শব্দ খুঁজুন…"],none:["No stories in this category yet.","এই বিভাগে এখনো কোনো খবর নেই।"],src:["Sources online","সক্রিয় সূত্র"]};
var C=[["all","All","সব"],["bangladesh","Bangladesh","বাংলাদেশ"],["international","International","আন্তর্জাতিক"],["banking","Banking","ব্যাংকিং"],["economy","Economy","অর্থনীতি"],["startups","Startups","স্টার্টআপ"]];
var G=[["Forbes","https://www.forbes.com/business/"],["Al Jazeera","https://www.aljazeera.com/economy/"],["Reuters","https://www.reuters.com/business/"],["Bloomberg","https://www.bloomberg.com/markets"],["Financial Times","https://www.ft.com/"],["The Economist","https://www.economist.com/business"]];
var T=[["Repo rate","রেপো রেট","Rate at which the central bank lends short-term funds to banks.","কেন্দ্রীয় ব্যাংক যে সুদে ব্যাংকগুলোকে স্বল্পমেয়াদি ঋণ দেয়।"],["Inflation","মূল্যস্ফীতি","General rise in prices over time.","সময়ের সাথে দামের সামগ্রিক বৃদ্ধি।"],["Liquidity","তারল্য","How easily assets turn into cash.","সম্পদ কত সহজে নগদে রূপান্তর হয়।"],["Remittance","রেমিট্যান্স","Money sent home by overseas workers.","প্রবাসীদের দেশে পাঠানো অর্থ।"],["Non-performing loan","খেলাপি ঋণ","A loan whose repayment is overdue.","যে ঋণের কিস্তি সময়মতো পরিশোধ হয়নি।"]];
function I(){return L=="bn"?1:0}
function t(k){return U[k][I()]}
function ago(ms){var m=Math.max(1,Math.round((Date.now()-ms)/60000));var s=m<60?m+(I()?" মিনিট":"m"):m<1440?Math.round(m/60)+(I()?" ঘণ্টা":"h"):Math.round(m/1440)+(I()?" দিন":"d");return I()?s+" আগে":s+" ago"}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
var FEEDS=[["The Daily Star","bangladesh","https://www.thedailystar.net/business/rss.xml"],["The Business Standard","bangladesh","https://www.tbsnews.net/rss.xml"],["The Financial Express","bangladesh","https://thefinancialexpress.com.bd/feed"],["BBC Business","international","https://feeds.bbci.co.uk/news/business/rss.xml"],["Al Jazeera","international","https://www.aljazeera.com/xml/rss/all.xml"],["Forbes","international","https://www.forbes.com/business/feed/"],["The Guardian Business","international","https://www.theguardian.com/uk/business/rss"]];
function plain(s){try{return(new DOMParser().parseFromString(s||"","text/html").body.textContent||"").replace(/\s+/g," ").trim()}catch(e){return""}}
function classify(t,b){if(/bank|loan|NPL|interest rate|monetary|lender|deposit/i.test(t))return"banking";if(/startup|fintech|venture|funding round/i.test(t))return"startups";if(b=="international"&&/inflation|GDP|economy|budget|tax|trade|tariff/i.test(t))return"economy";return b}
function getFeed(f){return fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(f[2])).then(function(r){return r.json()}).then(function(j){
 if(j.status!="ok")throw 0;
 return{ok:true,items:j.items.map(function(i){var d=Date.parse(String(i.pubDate||"").replace(" ","T")+"Z");return{t:plain(i.title),l:i.link,s:plain(i.description).slice(0,150),src:f[0],c:classify(plain(i.title),f[1]),d:isNaN(d)?0:d}})}}).catch(function(){return{ok:false,items:[]}})}
function load(){document.getElementById("st").textContent=t("load");
 Promise.all(FEEDS.map(getFeed)).then(function(res){
  var all=[],seen={};res.forEach(function(r){r.items.forEach(function(i){if(i.t&&i.l&&!seen[i.l]){seen[i.l]=1;all.push(i)}})});
  all.sort(function(a,b){return b.d-a.d});
  D={items:all.slice(0,90),status:res.map(function(r,i){return{n:FEEDS[i][0],ok:r.ok}}),rates:(D&&D.rates)||{},updated:Date.now()};
  draw();
  fetch("https://open.er-api.com/v6/latest/USD").then(function(r){return r.json()}).then(function(j){var o={};["USD","EUR","GBP","INR","SAR","AED","JPY"].forEach(function(k){o[k]=j.rates.BDT/j.rates[k]});D.rates=o;if(TAB=="rates")draw()}).catch(function(){})
 }).catch(function(){document.getElementById("st").textContent=t("fail")})}
function draw(){
 document.documentElement.lang=L;
 document.getElementById("en").className=L=="en"?"on":"";document.getElementById("bn").className=L=="bn"?"on":"";
 if(D)document.getElementById("st").textContent=t("live")+" "+ago(D.updated);
 var ch=document.getElementById("chips");ch.className="chips"+(TAB=="news"?"":" hide");
 ch.innerHTML=C.map(function(c){return '<button data-c="'+c[0]+'" class="'+(CAT==c[0]?"on":"")+'">'+c[I()+1]+"</button>"}).join("");
 var nv=[["news","▤"],["rates","৳"],["global","🌐"],["terms","Aa"]];
 document.getElementById("nav").innerHTML=nv.map(function(x){return '<button data-t="'+x[0]+'" class="'+(TAB==x[0]?"on":"")+'"><i>'+x[1]+"</i>"+t(x[0])+"</button>"}).join("");
 var h="";
 if(TAB=="news"){
  if(!D)h='<div class="note">'+t("load")+"</div>";
  else{var l=D.items.filter(function(x){return CAT=="all"||x.c==CAT});
   h=l.length?l.map(function(x){var nw=Date.now()-x.d<3600000;var cc=C.filter(function(k){return k[0]==x.c})[0];
    return '<a class="art" target="_blank" rel="noopener" href="'+esc(x.l)+'"><div class="tag">'+(cc?cc[I()+1]:x.c)+(nw?'<span class="new">NEW</span>':"")+"</div><h3>"+esc(x.t)+"</h3>"+(x.s?"<p>"+esc(x.s)+"…</p>":"")+'<div class="meta">'+esc(x.src)+" · "+(x.d?ago(x.d):"")+"</div></a>"}).join(""):'<div class="note">'+t("none")+"</div>";
   h+='<div class="note">'+t("src")+": "+D.status.filter(function(s){return s.ok}).length+"/"+D.status.length+"</div>"}
 }else if(TAB=="rates"){
  h="<h2>"+t("cur")+"</h2>";
  if(D&&D.rates&&Object.keys(D.rates).length)h+="<table>"+Object.keys(D.rates).map(function(k){return"<tr><td>"+k+"</td><td>৳ "+D.rates[k].toFixed(2)+"</td></tr>"}).join("")+"</table>";else h+='<div class="note">'+t("load")+"</div>";
  h+='<div class="note">'+t("dse")+"</div>";
 }else if(TAB=="global"){
  h=G.map(function(g){return'<a class="art" target="_blank" rel="noopener" href="'+g[1]+'"><h3>'+g[0]+"</h3></a>"}).join("");
 }else{h='<input id="q" placeholder="'+t("srch")+'"><div id="tl"></div>'}
 document.getElementById("app").innerHTML=h;
 if(TAB=="terms"){var q=document.getElementById("q");q.oninput=terms;terms()}}
function terms(){var q=document.getElementById("q").value.toLowerCase();
 document.getElementById("tl").innerHTML=T.filter(function(x){return x.join(" ").toLowerCase().indexOf(q)>-1}).map(function(x){return'<div class="term"><b>'+x[0]+" · "+x[1]+"</b><span>"+x[I()+2]+"</span></div>"}).join("")}
document.addEventListener("click",function(e){
 if(e.target.id=="rf"){load();return}
 var b=e.target.closest("button");if(!b)return;
 if(b.id=="en"||b.id=="bn"){L=b.id;try{localStorage.setItem("lang",L)}catch(x){}}
 else if(b.dataset.t){TAB=b.dataset.t;scrollTo(0,0)}else if(b.dataset.c){CAT=b.dataset.c}else return;
 draw()});
draw();load();setInterval(load,300000);
</script></body></html>
